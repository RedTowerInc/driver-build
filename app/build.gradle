plugins { id 'com.android.application' }
android {
    namespace 'dev.geohide.switcher'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.geohide.switcher'
        minSdk 28
        targetSdk 35
        versionCode 20100
        versionName '2.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

tasks.register('publicDnsSmoke', JavaExec) {
    dependsOn 'testDebugUnitTest'
    classpath = files("$buildDir/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes", "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes") + configurations.debugUnitTestRuntimeClasspath
    mainClass = 'dev.geohide.switcher.PublicDnsSmoke'
}
