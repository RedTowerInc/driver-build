name: GeoHide Android APK and device QA
on:
  push:
    branches: [geohide-switch-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK and build checks
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/device-qa.sh
      - name: Package APK
        if: success() && matrix.api == 35
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/GeoHideSwitch_v2.0.0_Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliverables/GeoHideSwitch_v2.0.0_Android.apk > deliverables/apk-signature.txt
          sha256sum deliverables/GeoHideSwitch_v2.0.0_Android.apk > deliverables/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 35
        with:
          name: GeoHideSwitch-v2.0.0-APK
          path: deliverables/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeoHideSwitch-QA-API${{ matrix.api }}
          path: |
            qa/
            app/build/reports/
            app/build/outputs/androidTest-results/
