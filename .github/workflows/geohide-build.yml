name: GeoHide Android APK and device QA
on:
  push:
    branches: [geohide-switch-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: build/native-deps
          key: geohide-native-sing1143-hev2180-ndk27-16kb-v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: geohide-go1255-sing1143-utls-v1
      - run: bash scripts/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeoHide-Native
          path: |
            app/src/main/jniLibs/
            app/src/main/assets/licenses/
  verify:
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/download-artifact@v4
        with:
          name: GeoHide-Native
          path: app/src/main
      - name: SDK and build checks
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug :app:assembleRelease :probe:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease --no-daemon --stacktrace
      - name: Public DNS availability
        if: matrix.api == 35
        continue-on-error: true
        run: |
          mkdir -p qa
          gradle :app:publicDnsSmoke --no-daemon > qa/public-dns-smoke.txt 2>&1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/device-qa.sh
      - name: Package APK
        if: success() && matrix.api == 35
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/release/app-release-unsigned.apk deliverables/GeoHideSwitch_v2.2.0_Android.apk
          echo "Unsigned release; permanent signature applied locally after QA" > deliverables/apk-signature.txt
          mkdir -p deliverables/tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliverables/tools/
          sha256sum deliverables/GeoHideSwitch_v2.2.0_Android.apk > deliverables/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 35
        with:
          name: GeoHideSwitch-v2.2.0-APK
          path: deliverables/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeoHideSwitch-QA-API${{ matrix.api }}
          path: |
            qa/
            app/build/reports/
            app/build/outputs/androidTest-results/
